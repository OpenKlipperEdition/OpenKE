# =========================================================================================
# Ender-3 V3 Series (KE & SE) Shared Hardware Configuration
# =========================================================================================
# This configuration file defines hardware features shared across the Creality Ender-3 V3
# family (V3 KE & V3 SE), including GD32F303 MCU internal temperature monitoring, automatic
# nozzle wiping / Z-offset compensation, and HX711 strain gauge load cell probing.
# =========================================================================================

# -----------------------------------------------------------------------------------------
# MCU Internal Temperature Sensor
# -----------------------------------------------------------------------------------------
# Reads the internal die temperature ADC sensor on the GD32F303 Cortex-M4 microcontroller
# using the NebulaOS compatibility extension driver.
# -----------------------------------------------------------------------------------------
[temperature_sensor mcu_temp]
sensor_type: nebulaos_temperature_mcu # Uses the NebulaOS compat driver for GD32 MCU internal temp
min_temp: 0                          # Minimum allowed temperature (°C) before thermal safety trip
max_temp: 100                        # Maximum allowed temperature (°C) before thermal safety trip

# -----------------------------------------------------------------------------------------
# Automatic Z-Offset Compensation & Nozzle Cleaning Algorithm
# -----------------------------------------------------------------------------------------
# Controls the automated nozzle heat-and-wipe routine, CR-Touch vs. strain-gauge delta
# calculation, and dynamic Z-offset calibration.
# -----------------------------------------------------------------------------------------
[z_compensate]
tri_min_hold: 1400                   # Minimum load cell ADC threshold to consider a valid touch
tri_max_hold: 2000                   # Maximum load cell ADC threshold to avoid excessive bed pressure
tri_expand_mm: 0.10                  # Compensation expansion margin (mm) for thermal/chassis flex
speed: 5                             # Probing travel speed (mm/s) during vertical descent
hot_start_temp: 180                  # Initial nozzle preheat temperature (°C) before wipe routine
hot_rub_temp: 200                    # Nozzle scrubbing temperature (°C) to melt residual plastic
hot_end_temp: 140                    # Cool-down temperature (°C) to solidify nozzle before probing
bed_add_temp: 60                     # Target bed heating temperature (°C) during compensation
clr_noz_start_x: -3                  # Starting X coordinate (mm) on the silicone nozzle wiper
clr_noz_start_y: 20                  # Starting Y coordinate (mm) on the silicone nozzle wiper
clr_noz_len_x: 3                     # Wipe stroke distance along X axis (mm)
clr_noz_len_y: 50                    # Wipe stroke distance along Y axis (mm)
pa_clr_dis_mm_x: 0                   # Post-wipe clearance offset on X axis (mm)
pa_clr_dis_mm_y: 30                  # Post-wipe clearance offset on Y axis (mm)
bl_offset: 0,27                      # Physical X,Y offset (mm) between nozzle and CR-Touch probe
noz_pos_center: 20,25                # X,Y coordinates (mm) of bed pressure sensor contact center
noz_pos_offset: 3,7                  # X,Y offset (mm) for multi-point secondary touch verification
pumpback_mm: 10                      # Filament retract distance (mm) during wipe to prevent ooze
vs_start_z_pos: 3                    # Safe Z height (mm) above bed before starting contact descent
pr_probe_cnt: 3                      # Number of probe sample repetitions for touch verification
pr_clear_probe_cnt: 3                # Number of verification touches after nozzle cleaning
type_nozz: 0                         # Nozzle geometry identifier (0 = standard factory brass nozzle)

# -----------------------------------------------------------------------------------------
# HX711 24-Bit ADC Strain Gauge Load Cell Sensor
# -----------------------------------------------------------------------------------------
# Drives the Avia Semiconductor HX711 24-bit ADC strain gauge connected to the nozzle/bed
# pressure sensor for physical contact detection during auto-calibration.
# -----------------------------------------------------------------------------------------
[nebulaos_z_offset_probe]
sensor_type: hx711                   # Avia Semiconductor HX711 24-bit ADC load cell amplifier driver
dout_pin: PC6                        # Microcontroller GPIO pin connected to HX711 data output (DOUT)
sclk_pin: PA4                        # Microcontroller GPIO pin connected to HX711 clock input (PD_SCK)
contact_speed: 2.0                   # Vertical descent speed (mm/s) during bed contact detection
retract_dist: 2.0                    # Vertical lift distance (mm) between repeated probe samples
retract_speed: 10.0                  # Lift/retract travel speed (mm/s) when moving away from bed
trigger_force: 75                    # Minimum contact force threshold (grams) to register a touch
force_safety_limit: 2000             # Maximum force limit (grams) before aborting to protect hardware
tare_time: 0.067                     # Sensor zero-calibration / settling time (seconds) before probing
