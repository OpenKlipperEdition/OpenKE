# OpenKE / NebulaOS Multi-Printer Profile Macros

[gcode_shell_command openke_set_profile]
command: /usr/bin/openke-profile set
timeout: 30.0
verbose: True

[gcode_shell_command openke_list_profiles]
command: /usr/bin/openke-profile list
timeout: 10.0
verbose: True

[gcode_macro LIST_PRINTER_PROFILES]
description: List all available printer profiles
gcode:
  RUN_SHELL_COMMAND CMD=openke_list_profiles

[gcode_macro SET_PRINTER_PROFILE]
description: Switch active printer profile (e.g. SET_PRINTER_PROFILE PROFILE=creality-ender3-v3-se)
gcode:
  {% set profile = params.PROFILE|default("")|string %}
  {% if profile != "" %}
    {action_respond_info("Switching printer profile to: " ~ profile ~ "...")}
    RUN_SHELL_COMMAND CMD=openke_set_profile PARAMS="{profile} --restart"
  {% else %}
    {action_respond_info("Usage: SET_PRINTER_PROFILE PROFILE=<profile_id> (e.g. creality-ender3-v3-se)")}
  {% endif %}
