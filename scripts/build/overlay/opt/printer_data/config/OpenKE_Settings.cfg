# Below you can include specific configuration files depending on what you want PRINT_START to do:
[include Macros/Adaptive_Meshing.cfg]
[include Macros/Line_Purge.cfg]
[include Macros/Smart_Park.cfg]
[include Macros/Printer_Profile.cfg]
[include GuppyScreen/guppy_cmd.cfg]
[include frontend-controls.cfg]

# Enables nebulaos compatibility layer, which provides host-side preflight and registered sensor types
[nebulaos_compat]

# Host MCU (klipper_mcu running on Ingenic X2000E SoC)
[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None
spi_speed: 2000000
spi_bus: spidev2.0
axes_map: z,y,x

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 70
probe_points: 110,110,100
max_freq: 90

# Phase 1.9B power-loss recovery: the physical BL24C16F EEPROM's production
# owner is now the Linux 6.6 in-tree at24/nvmem kernel driver (see
# accelerometer-eeprom-bus-enable-variant.sh's own eeprom@50 DT node and
# CONFIG_EEPROM_AT24=y - NOT [bl24c16f]/i2c_mcu:rpi/CONFIG_I2C_CHARDEV, which
# owned this same chip in Phase 1.9A and is deliberately NOT instantiated
# here any more; extras/bl24c16f.py itself stays vendored in
# NebulaOS-klipper-extensions for provenance only). eeprom_path below must
# match that DT node's resulting sysfs path exactly.
[nebulaos_power_loss_recovery]
eeprom_path: /sys/bus/i2c/devices/2-0050/eeprom

[gcode_macro _OpenKE_Settings]
description: This macro contains all adjustable Print settings
# The following variables are settings for Prints as a whole.
variable_verbose_enable: True               # Set to True to enable berbose information output when running. This is useful for debugging.
# The following variables are for adjusting adaptive mesh settings.
variable_mesh_margin: 0                     # Expands the mesh size in millimeters if desired. Leave at 0 to disable.
variable_fuzz_amount: 0                     # Slightly randomizes mesh points to spread out wear from nozzle-based probes. Leave at 0 to disable.
# The following variables are for those with a dockable probe like Klicky, Euclid, etc.                 # ----------------  Attach Macro | Detach Macro
variable_probe_dock_enable: False           # Set to True to enable the usage of a dockable probe.      # ---------------------------------------------
variable_attach_macro: 'Attach_Probe'       # The macro that is used to attach the probe.               # Klicky Probe:   'Attach_Probe' | 'Dock_Probe'
variable_detach_macro: 'Dock_Probe'         # The macro that is used to store the probe.                # Euclid Probe:   'Deploy_Probe' | 'Stow_Probe'
                                                                                                         # Legacy Gcode:   'M401'         | 'M402'
# The following variables are for adjusting adaptive purge.
variable_purge_height: 0.8                  # Z position of nozzle during purge, default is 0.8.
variable_tip_distance: 0                    # Distance between tip of filament and nozzle before purge. Should be similar to PRINT_END final retract amount.
variable_purge_margin: 10                   # Distance the purge will be in front of the print area, default is 10.
variable_purge_amount: 30                   # Amount of filament to be purged prior to printing.
variable_flow_rate: 12                      # Flow rate of purge in mm3/s. Default is 12.
# The following variables are for adjusting the Smart Park feature, which will park the printhead near the print area at a specified height.
variable_smart_park_height: 10              # Z position for Smart Park, default is 10.

gcode: # Gcode section left intentionally blank. Do not disturb.

    {action_respond_info(" Running the OpenKE_Settings macro does nothing, it is only used for storing OpenKE's settings. ")}
