# NebulaOS & OpenKE Kernel & Memory Resilience Configuration
# Protects against system-wide lockups, memory direct reclaim freezes, and hung tasks

# 1. Kernel Panic & Crash Auto-Recovery
kernel.panic = 5
kernel.panic_on_oops = 1

# 2. Hung Task Detection
kernel.hung_task_timeout_secs = 30
kernel.hung_task_panic = 0

# 3. Memory Watermark & Direct Reclaim Protection
vm.min_free_kbytes = 8192

# 4. Dirty Page Cache Flushing (Flash Write Pacing)
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# 5. VFS Cache Pressure
vm.vfs_cache_pressure = 50

# 6. Network Socket Recycling
net.ipv4.tcp_fin_timeout = 15
