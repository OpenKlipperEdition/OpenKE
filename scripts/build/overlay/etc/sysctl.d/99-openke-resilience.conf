# NebulaOS & OpenKE Kernel & Memory Resilience Configuration
# Protects against system-wide lockups, memory direct reclaim freezes, and hung tasks

# 1. Kernel Panic & Crash Auto-Recovery
# Automatically reboot 5 seconds after a kernel panic instead of halting indefinitely
kernel.panic = 5
kernel.panic_on_oops = 1

# 2. Hung Task Detection
# Detect any thread stuck in Uninterruptible Sleep (D state) for > 30 seconds
kernel.hung_task_timeout_secs = 30
# Log warning and stack trace to dmesg/console when a task hangs
kernel.hung_task_panic = 0

# 3. Memory Watermark & Direct Reclaim Protection
# Keep an 8MB reserve of clean pages so background kswapd reclaims pages before userspace hits direct reclaim stalls
vm.min_free_kbytes = 8192

# 4. Dirty Page Cache Flushing (Flash Write Pacing)
# Cap dirty page cache at 10% memory to keep fsync() latency short and avoid large flash controller write stalls
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# 5. VFS Cache Pressure
# Prevent kernel from excessively thrashing dentry and inode caches
vm.vfs_cache_pressure = 50

# 6. Network Socket Recycling
# Clean up dead / abandoned TCP sockets quickly (15s instead of default 60s)
net.ipv4.tcp_fin_timeout = 15
