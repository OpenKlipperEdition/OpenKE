WIFI_FIRMWARE_BIN_SHA256=82ed67a211877efa47aff4aab83d6d2d1ccf3d5d0f5c396df97f292ade01de9e
WIFI_FIRMWARE_CLM_SHA256=1dbe1a396b68786bb189b7c255318ae546fd2e9d15f70ccc8ecbdc52b6cd4c47

# --- GuppyScreen (OpenKlipperEdition, moving OKE branch) ---
#
# This follows the same moving-source policy as the kernel and official Klipper:
# every build refreshes the shallow checkout to the latest OKE branch tip, while
# the exact fetched commit is recorded in build-manifest.txt.
GUPPYSCREEN_REPO=https://github.com/OpenKlipperEdition/GuppyScreen.git
GUPPYSCREEN_BRANCH=OKE
GUPPYSCREEN_VERSION=v1.5.0-OpenKE
GUPPYSCREEN_THEME=blue

