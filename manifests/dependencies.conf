# Authoritative dependency pin manifest for the NebulaOS firmware build.
#
# One rule: every immutable external source this build depends on has its
# exact pinned ref recorded HERE, and nowhere else. The kernel, Klipper, and
# GuppyScreen are explicit branch exceptions: each follows its configured branch.
# The fetch script sources this file rather than hardcoding pins inline (previously each pin
# lived as a shell variable scattered across that script - functionally equivalent, but
# "the one obvious authoritative file" was not obvious).
#
# Format: plain shell variable assignments (this file is `.`-sourced by
# 00-fetch-vendor-sources.sh directly - no parsing dependency, no jq/python
# needed this early in the pipeline). Comments and blank lines allowed.
#
# To bump an immutable dependency: edit the value below, in its own reviewed
# commit, then re-run 00-fetch-vendor-sources.sh. The kernel, Klipper, and
# GuppyScreen do not use this pin workflow; their fetched SHAs are recorded in
# build-manifest.txt after each build.
#
# A dependency with NO entry here, or an entry left as the placeholder
# UNPINNED_MUST_SET_BEFORE_BUILD, causes 00-fetch-vendor-sources.sh to fail
# immediately, by design - see its own "required pin" check.

# --- OpenKlipperEdition/System (OKE branch, full checkout supplying kernel + Buildroot) ---
#
# 2026-08-20: switch the kernel source to the canonical Open Klipper Edition
# System repository. This is intentionally a moving dependency: every build
# refreshes to the latest commit on OKE, and build-manifest.txt records the
# exact SHA that was actually used.
SYSTEM_REPO=https://github.com/OpenKlipperEdition/System.git
SYSTEM_BRANCH=OKE


# --- Klipper runtime (official upstream, moving master branch) ---
#
# This is intentionally the pure upstream Klipper workflow. 00-fetch-
# vendor-sources.sh refreshes the checkout to origin/master on every build;
# there is no KLIPPER_PIN and therefore no exact-commit reproducibility for
# this dependency. Fork-only NebulaOS/Creality extras are not part of this
# runtime configuration.
KLIPPER_REPO=https://github.com/Klipper3d/klipper.git
KLIPPER_BRANCH=master

# --- Moonraker (official, not forked) ---
MOONRAKER_REPO=https://github.com/Arksine/moonraker.git
MOONRAKER_PIN=d5ee17128bb88434aacdab90c2e9e990e2b64e4a

# --- Camera pipeline (real GPLv3 uStreamer port for this board family) ---
K1_USTREAMER_REPO=https://github.com/pellcorp/k1-ustreamer.git
K1_USTREAMER_PIN=18e30bb313d54b1b01dd995bd31ce5a3d5adffd6

# --- v4l2-ctl (diagnostic utility, autotools build, pinned to v1.20.0's
# exact resolved commit rather than the tag name) ---
# Virgin-Baseline Fix + Rebuild mission (2026-08-08): git.linuxtv.org (the
# canonical upstream) had a real, observed outage (502/504) mid-build,
# twice, on two separate fresh-clone attempts. V4L_UTILS_REPO/PIN remain
# the source of truth for identity (never changed by this fix - same
# commit, same project) but 00-fetch-vendor-sources.sh now fetches the
# actual bytes from a deterministic, SHA256-pinned archive instead of a
# live git clone, removing this one third-party server from the build's
# critical path. The archive was built from a mirror (github.com/gjasny/
# v4l-utils) only after independently verifying, via git's own content-
# addressed commit hash, that its copy of this exact commit is byte-
# identical to what git.linuxtv.org itself would serve - see that
# release's own notes for the full verification record.
V4L_UTILS_REPO=https://git.linuxtv.org/v4l-utils.git
V4L_UTILS_PIN=3b22ab02b960e4d1e90618e9fce9b7c8a80d814a
V4L_UTILS_ARCHIVE_URL=https://github.com/coreflake1/NebulaOS-firmware/releases/download/v4l-utils-vendor-src-3b22ab0/v4l-utils-3b22ab0-pinned-src.tar.gz
V4L_UTILS_ARCHIVE_SHA256=e7703e35cba9d03ae09778d99b66c23d855cb31cf9cb58b4d52a35ae544463e1

# --- Mainsail (built Vue app, fetched as a release archive - pinned by tag
# AND a sha256 of the downloaded zip, not a git ref) ---
MAINSAIL_TAG=v2.18.2
MAINSAIL_SHA256=df2ba7c301f7bfc8ac9f122741a6ba08356d679ecfa1f62f898d0337802d5de5

# --- Board NVRAM (Cypress/Broadcom-format, board-specific calibration data) ---
#
# 2026-08-07 (canonical-repository mission): redistribution explicitly
# authorized by the repository owner - see LICENSES/WIFI-FIRMWARE-NOTICE.md
# for the full provenance/license reasoning. Published as a GitHub Release
# asset on this same repo (wifi-firmware-v1.0.0) and fetched the same way
# Mainsail is above: pinned tag + URL + archive sha256, individual file
# hash checked after extraction.
#
# 2026-08-09 (WiFi .125 promotion): this pin now covers ONLY the NVRAM
# (.txt) file. The .bin/.clm_blob pair that used to travel in the same
# release archive (the obsolete 7.46.58.13 control firmware) is retired -
# see WIFI_FIRMWARE_BIN_SHA256/WIFI_FIRMWARE_CLM_SHA256 below, now sourced
# directly from Infineon's own upstream repo instead. The NVRAM itself is
# real per-board calibration data extracted from this project's own
# hardware, unrelated to which firmware build is running, and stays
# byte-identical across this promotion (confirmed live: unchanged on the
# running device both before and after the .125 switch).
WIFI_FIRMWARE_RELEASE_TAG=wifi-firmware-v1.0.0
WIFI_FIRMWARE_RELEASE_URL=https://github.com/coreflake1/NebulaOS-firmware/releases/download/wifi-firmware-v1.0.0/nebulaos-wifi-firmware-1.0.0.tar.gz
WIFI_FIRMWARE_ARCHIVE_SHA256=20c22ee2e3b7469b1240f991457e7217d3b1c8d858595754582e4f097311b08c
WIFI_FIRMWARE_TXT_SHA256=78fee458ab69c0a66ea462f6d6769e15b36f73582693f4dbb5a0e8e8be3cfb0a

