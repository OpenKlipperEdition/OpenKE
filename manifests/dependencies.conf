# --- qualified baseline (explicit, not auto-selected) ---
# NebulaOS Final Closure mission, Phase B (2026-08-15): assert-baseline-
# config.sh and baseline-difference-gate.sh used to pick their own
# reference via `git tag -l 'nebulaos-canonical-baseline-*' --sort=
# -creatordate | head -1` - better than the hardcoded-stale tag it replaced
# (see the Phase 11 report's own §2), but still implicit: a new tag
# silently becomes the verifier's reference the moment it's pushed, with
# no deliberate promotion step and no record of which tag a given
# verification run actually checked. One explicit value here instead -
# release/qualification promotion means deliberately changing this line,
# in its own reviewed commit, not just pushing a new tag. Both scripts
# fail loudly if this value doesn't name a tag that actually exists in the
# checkout, and both print the exact tag used.
# 2026-08-21: promoted after a clean Docker rebuild/requalification using
# OpenKlipperEdition/System OKE @ 591bd3414e65004fb21b10ba7a2182e5bdd915f2
# (Linux 6.6.152). The prior 2026-08-20 baseline remains as historical context.
